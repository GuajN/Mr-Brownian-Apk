name: Build Mr Brownian APK

on:
  push:
    branches:
      - main
    paths:
      - '000_MrBrownian_V51.28.py'
      - '000_MrBrownian_V51.29.py'
      - 'buildozer.spec'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip wget curl \
            python3-pip python3-venv python3-setuptools \
            libffi-dev libssl-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake autoconf automake libtool pkg-config \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user 'Cython==0.29.36' 'buildozer==1.5.0'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare and patch python-for-android runtime extraction
        run: |
          git clone https://github.com/kivy/python-for-android.git "$RUNNER_TEMP/python-for-android"
          git -C "$RUNNER_TEMP/python-for-android" checkout 0382d27de2f7315ed98e74884bafb30365decdee
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["RUNNER_TEMP"]) / "python-for-android"
          util = root / "pythonforandroid/bootstraps/common/build/src/main/java/org/kivy/android/PythonUtil.java"
          activity = root / "pythonforandroid/bootstraps/sdl2/build/src/main/java/org/kivy/android/PythonActivity.java"
          start_c = root / "pythonforandroid/bootstraps/common/build/jni/application/src/start.c"

          code = util.read_text()
          if "import java.util.zip.ZipFile;" not in code:
              code = code.replace("import java.util.regex.Pattern;", "import java.util.regex.Pattern;\nimport java.util.zip.ZipFile;")
          method = r"""
              private static boolean isPythonBundleUsable(File target) {
                  File bundleDir = new File(target, "_python_bundle");
                  File stdlibZip = new File(bundleDir, "stdlib.zip");
                  File modulesDir = new File(bundleDir, "modules");
                  if (!stdlibZip.isFile() || stdlibZip.length() < 100000 || !modulesDir.isDirectory()) {
                      return false;
                  }
                  File[] modules = modulesDir.listFiles();
                  if (modules == null || modules.length == 0) {
                      return false;
                  }
                  try (ZipFile zip = new ZipFile(stdlibZip)) {
                      return zip.getEntry("encodings/__init__.pyc") != null
                          && zip.getEntry("encodings/utf_8.pyc") != null;
                  } catch (Exception e) {
                      Log.e(TAG, "Python standard library ZIP is unreadable", e);
                      return false;
                  }
              }

              public static boolean unpackPyBundle(
                      Context ctx, final String resource, File target, boolean cleanup_on_version_update) {

                  Log.v(TAG, "Unpacking " + resource + " " + target.getName());
                  String dataVersion = getResourceString(ctx, "private_version");
                  String diskVersion = "";
                  if (dataVersion == null) {
                      Log.e(TAG, "Python bundle version metadata is missing");
                      return false;
                  }

                  String diskVersionFn = target.getAbsolutePath() + "/libpybundle.version";
                  try (InputStream is = new FileInputStream(diskVersionFn)) {
                      byte[] buf = new byte[64];
                      int len = is.read(buf);
                      diskVersion = len > 0 ? new String(buf, 0, len) : "";
                  } catch (Exception e) {
                      diskVersion = "";
                  }

                  if (dataVersion.equals(diskVersion) && isPythonBundleUsable(target)) {
                      Log.i(TAG, "Python runtime bundle verified; using existing extraction");
                      return true;
                  }

                  Log.w(TAG, "Python runtime bundle is missing, incomplete, or outdated; extracting again");
                  File bundleDir = new File(target, "_python_bundle");
                  recursiveDelete(bundleDir);
                  target.mkdirs();

                  AssetExtract ae = new AssetExtract(ctx);
                  if (!ae.extractTar(resource + ".so", target.getAbsolutePath(), "pybundle")) {
                      recursiveDelete(bundleDir);
                      Log.e(TAG, "Could not extract Python runtime bundle; version stamp not updated");
                      return false;
                  }
                  if (!isPythonBundleUsable(target)) {
                      recursiveDelete(bundleDir);
                      Log.e(TAG, "Extracted Python runtime bundle failed stdlib/codec validation");
                      return false;
                  }

                  try (FileOutputStream os = new FileOutputStream(diskVersionFn)) {
                      os.write(dataVersion.getBytes());
                  } catch (Exception e) {
                      Log.w(TAG, "Could not write Python bundle version stamp; verified bundle will be rechecked next launch", e);
                  }
                  return true;
              }
          """
          pattern = re.compile(r"    public static void unpackPyBundle\(.*?\n    \}", re.S)
          code, count = pattern.subn(method.strip("\n"), code)
          if count != 1:
              raise SystemExit(f"Expected one unpackPyBundle method, found {count}")
          util.write_text(code)

          code = activity.read_text()
          call_pattern = re.compile(
              r"(?m)^[ \t]*PythonUtil\.unpackPyBundle\(\n"
              r"[ \t]*mActivity,\n"
              r"[ \t]*getApplicationInfo\(\)\.nativeLibraryDir \+ \"/\" \+ \"libpybundle\",\n"
              r"[ \t]*app_root_file,\n"
              r"[ \t]*false\);\n"
              r"[ \t]*return null;"
          )
          new_call = """            boolean bundleReady = PythonUtil.unpackPyBundle(
                    mActivity,
                    getApplicationInfo().nativeLibraryDir + "/" + "libpybundle",
                    app_root_file,
                    false);
            if (!bundleReady) {
                return "Mr Brownian's Python runtime could not be extracted or verified. Restart the app to retry.";
            }
            return null;"""
          code, count = call_pattern.subn(lambda _: new_call, code, count=1)
          if count != 1:
              raise SystemExit("Could not locate PythonActivity Python-bundle extraction call")
          marker = "        protected void onPostExecute(String result) {"
          if code.count(marker) != 1:
              raise SystemExit("Could not locate PythonActivity onPostExecute")
          code = code.replace(marker, marker + """
                    if (result != null) {
                        Log.e(TAG, result);
                        Toast.makeText(mActivity, result, Toast.LENGTH_LONG).show();
                        mActivity.finish();
                        return;
                    }""", 1)
          activity.write_text(code)

          code = start_c.read_text()

          # Do not call PyImport_AppendInittab: CPython 3.12 keeps its
          # inittab state after finalization, so a later registration aborts.
          append_old = '''  PyImport_AppendInittab("androidembed", initandroidembed);'''
          if code.count(append_old) != 1:
              raise SystemExit("Expected exactly one upstream androidembed inittab call")
          code = code.replace(append_old, "", 1)
          module_marker = '''#endif

          int dir_exists(char *filename) {'''
          module_helper = '''#endif

          #if PY_MAJOR_VERSION >= 3
          static int register_androidembed_module(void) {
              PyObject *modules = PyImport_GetModuleDict();
              if (PyDict_GetItemString(modules, "androidembed") != NULL) {
                  return 0;
              }
              PyObject *module = PyModule_Create(&androidembed);
              if (module == NULL) {
                  return -1;
              }
              int result = PyDict_SetItemString(modules, "androidembed", module);
              Py_DECREF(module);
              return result;
          }
          #endif

          int dir_exists(char *filename) {'''
          if code.count(module_marker) != 1:
              raise SystemExit("Could not locate androidembed module declaration boundary")
          code = code.replace(module_marker, module_helper, 1)

          init_marker = '''              PyConfig_Clear(&config);

          LOGP("Initialized python");'''
          init_addition = '''              PyConfig_Clear(&config);

          #if PY_MAJOR_VERSION >= 3
              if (register_androidembed_module() < 0) {
                  LOGP("Could not register androidembed in sys.modules");
                  PyErr_Print();
                  return 1;
              }
          #endif

          LOGP("Initialized python");'''
          if code.count(init_marker) != 1:
              raise SystemExit("Could not locate post-initialization module registration point")
          code = code.replace(init_marker, init_addition, 1)
          if "PyImport_AppendInittab(" in code:
              raise SystemExit("Unsafe PyImport_AppendInittab call remains in patched start.c")

          bundle_pattern = re.compile(
              r'(?m)^[ \t]*snprintf\(python_bundle_dir, 256,\n'
              r'[ \t]*"%s/_python_bundle", getenv\("ANDROID_UNPACK"\)\);'
          )
          bundle_addition = """  snprintf(python_bundle_dir, 256,
                     "%s/_python_bundle", getenv("ANDROID_UNPACK"));
          char stdlib_zip_path[512];
          char modules_path[512];
          snprintf(stdlib_zip_path, sizeof(stdlib_zip_path), "%s/stdlib.zip", python_bundle_dir);
          snprintf(modules_path, sizeof(modules_path), "%s/modules", python_bundle_dir);
          if (!dir_exists(python_bundle_dir) || access(stdlib_zip_path, R_OK) != 0 || !dir_exists(modules_path)) {
            LOGP("Python runtime bundle is incomplete; refusing unsafe interpreter startup");
            return 1;
          }"""
          code, count = bundle_pattern.subn(lambda _: bundle_addition, code, count=1)
          if count != 1:
              raise SystemExit("Could not locate Python bundle path setup in start.c")

          program_pattern = re.compile(r'(?m)^[ \t]*config\.program_name = L"android_python";')
          new_program = """      PyStatus program_status = PyConfig_SetString(&config, &config.program_name, L"android_python");
          if (PyStatus_Exception(program_status)) {
              LOGP("Could not set Python program name: %s", program_status.err_msg);
              PyConfig_Clear(&config);
              return 1;
          }"""
          code, count = program_pattern.subn(lambda _: new_program, code, count=1)
          if count != 1:
              raise SystemExit("Could not locate PyConfig program_name assignment")

          paths_pattern = re.compile(
              r"(?m)^[ \t]*PyWideStringList_Append\(&config\.module_search_paths, wchar_zip_path\);\n"
              r"[ \t]*PyWideStringList_Append\(&config\.module_search_paths, wchar_modules_path\);"
          )
          new_paths = """            PyStatus path_status = PyWideStringList_Append(&config.module_search_paths, wchar_zip_path);
              if (PyStatus_Exception(path_status)) {
                  LOGP("Could not add Python stdlib.zip path: %s", path_status.err_msg);
                  PyConfig_Clear(&config);
                  return 1;
              }
              path_status = PyWideStringList_Append(&config.module_search_paths, wchar_modules_path);
              if (PyStatus_Exception(path_status)) {
                  LOGP("Could not add Python modules path: %s", path_status.err_msg);
                  PyConfig_Clear(&config);
                  return 1;
              }"""
          code, count = paths_pattern.subn(lambda _: new_paths, code, count=1)
          if count != 1:
              raise SystemExit("Could not locate Python module search path setup")

          init_pattern = re.compile(
              r'(?m)^[ \t]*PyStatus status = Py_InitializeFromConfig\(&config\);\n'
              r'[ \t]*if \(PyStatus_Exception\(status\)\) \{\n'
              r'[ \t]*LOGP\("Python initialization failed:"\);\n'
              r'[ \t]*LOGP\(status\.err_msg\);\n'
              r'[ \t]*\}'
          )
          new_init = """    if (!Py_IsInitialized()) {
                  PyStatus status = Py_InitializeFromConfig(&config);
                  if (PyStatus_Exception(status)) {
                      LOGP("Python initialization failed:");
                      LOGP(status.err_msg);
                      PyConfig_Clear(&config);
                      return 1;
                  }
                  LOGP("Python interpreter initialized successfully");
              } else {
                  LOGP("Reusing already initialized Python interpreter");
              }
              PyConfig_Clear(&config);"""
          code, count = init_pattern.subn(lambda _: new_init, code, count=1)
          if count != 1:
              raise SystemExit("Could not locate Python initialization error handling")
          start_c.write_text(code)

          print("Patched python-for-android: validate/retry stdlib extraction, stop safely on failure, and validate startup paths.")
          PY
          sed -i "/^p4a.commit =/a p4a.source_dir = $RUNNER_TEMP/python-for-android" buildozer.spec

      - name: Guard SDL resume when the surface is not ready
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          recipe = Path(os.environ["RUNNER_TEMP"]) / "python-for-android/pythonforandroid/recipes/sdl2/__init__.py"
          code = recipe.read_text()
          needle = "    def build_arch(self, arch):\n        env = self.get_recipe_env(arch)\n"
          if code.count(needle) != 1:
              raise SystemExit(f"Expected one SDL build_arch header, found {code.count(needle)}")

          patch = '''
                  # Guard SDL's resume path when Android recreates the Activity
                  # before its SurfaceView exists.
                  from pathlib import Path
                  java_root = Path(self.get_build_dir(arch.arch))
                  candidates = list(java_root.rglob("SDLActivity.java"))
                  if len(candidates) != 1:
                      raise RuntimeError(
                          f"Expected exactly one SDLActivity.java under {java_root}, found {len(candidates)}"
                      )
                  java_file = candidates[0]
                  java = java_file.read_text()
                  unsafe = "if (mSurface.mIsSurfaceReady && mHasFocus && mIsResumedCalled) {"
                  safe = "if (mSurface != null && mSurface.mIsSurfaceReady && mHasFocus && mIsResumedCalled) {"
                  if unsafe in java:
                      java_file.write_text(java.replace(unsafe, safe, 1))
                  elif safe not in java:
                      raise RuntimeError("SDL handleNativeState surface guard target not found")
          '''
          code = code.replace(needle, needle + patch, 1)
          recipe.write_text(code)

          # Verify the inserted build hook before continuing.
          check = recipe.read_text()
          if check.count("Expected exactly one SDLActivity.java") != 1:
              raise SystemExit("SDL surface guard hook verification failed")
          print("Inserted SDL null-surface guard into build_arch().")
          PY

      - name: Prepare Android-compatible CPython source
        run: |
          curl -L --fail --retry 3 https://www.python.org/ftp/python/3.12.0/Python-3.12.0.tgz -o /tmp/Python-3.12.0.tgz
          tar -xzf /tmp/Python-3.12.0.tgz -C "$RUNNER_TEMP"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          source = Path(os.environ["RUNNER_TEMP"]) / "Python-3.12.0/Modules/grpmodule.c"
          code = source.read_text()
          signature = re.compile(
              r"(static PyObject\s*\*\s*grp_getgrall_impl\s*\([^)]*\)\s*"
              r"/\*.*?\*/\s*)\{",
              re.S,
          )
          match = signature.search(code)
          if not match:
              raise SystemExit("Could not locate CPython 3.12.0 grp_getgrall_impl; refusing unsafe patch.")

          body_start = match.end()
          depth = 1
          index = body_start
          while index < len(code) and depth:
              if code[index] == "{":
                  depth += 1
              elif code[index] == "}":
                  depth -= 1
              index += 1
          if depth:
              raise SystemExit("Could not identify grp_getgrall_impl body; refusing unsafe patch.")

          old_body = code[body_start:index - 1]
          if "setgrent()" not in old_body or "getgrent()" not in old_body or "endgrent()" not in old_body:
              raise SystemExit("Unexpected grp_getgrall_impl body; refusing unsafe patch.")

          new_body = """
          #ifdef ANDROID
              /* Group enumeration APIs require Android API 26+.
                 Keep minapi 24 support; grp.getgrall() returns an empty list. */
              return PyList_New(0);
          #else
          """ + old_body + """
          #endif
          """
          source.write_text(code[:body_start] + new_body + code[index - 1:])
          print("Applied Android API 24 compatibility patch to CPython grp.getgrall.")
          PY
          echo "P4A_python3_DIR=$RUNNER_TEMP/Python-3.12.0" >> "$GITHUB_ENV"

      - name: Prepare V51.29 application entry point
        run: |
          cp 000_MrBrownian_V51.28.py 000_MrBrownian_V51.29.py
          cp 000_MrBrownian_V51.29.py main.py

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MrBrownian-V51.29-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
